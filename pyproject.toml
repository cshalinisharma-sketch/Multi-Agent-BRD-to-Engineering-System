[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "brd2eng"
version = "0.2.0"
description = "7-agent BRD-to-engineering system (LangGraph orchestration, LangChain LLM calls, offline-ready)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph==1.2.18",
  "langchain-core==1.7.0",
  "pydantic==2.11.7",
  "numpy==2.3.1",
  "scikit-learn==1.9.1",
  "python-docx==1.2.0",
  "reportlab==5.1.0",
]

[project.optional-dependencies]
openai = ["langchain-openai==1.7.3"]
anthropic = ["langchain-anthropic==1.7.6"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
